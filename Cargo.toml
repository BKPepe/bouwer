[package]
name = "bouwer"
version = "0.3.0"
authors = ["George Sapkin <george@sapk.in>"]
description = "OpenWrt firmware builder GUI"
license = "GPL-3.0-only"
readme = "README.md"
edition = "2024"
rust-version = "1.100"

[dependencies]
anyhow = "1.0"
bollard = "0.21"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
fst = "0.4"
futures-util = "0.3"
human_bytes = { version = "0.4", default-features = false }
i-slint-backend-winit = "1.19"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "time",
] }
ureq = { version = "3", features = ["json"] }

# Native Linux, macOS, or Windows
[target.'cfg(any(target_os = "linux", target_os = "macos", target_env = "msvc"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "compat-1-2", "renderer-skia"] }

# Cross-compile Windows from Linux
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "compat-1-2", "renderer-software"] }

# macOS doesn't ship OpenSSL, so link it statically
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[package.metadata.packager]
product-name = "Bouwer"
identifier = "in.sapk.bouwer"
copyright = "Copyright © 2026 George Sapkin"
icons = ["assets/logo.icns"]
resources = ["LICENSE"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad-hoc signature
signing-identity = "-"

[package.metadata.winresource]
ProductName = "Bouwer"
FileDescription = "Bouwer - OpenWrt firmware builder"
LegalCopyright = "Copyright © 2026 George Sapkin"
OriginalFilename = "bouwer.exe"
