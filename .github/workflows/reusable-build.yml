name: Reusable Build
on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bouwer-macos-latest-aarch64
            package: '*.dmg'
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: bouwer-macos-latest-x86_64
            package: '*.dmg'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bouwer-ubuntu-latest
            package: bouwer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bouwer-windows-latest
            package: bouwer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev upx-ucl

      - name: Install dependencies
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: upx --lzma --best --filter=0 target/${{ matrix.target }}/release/bouwer

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          rm -f target/${{ matrix.target }}/release/*.dmg
          cargo packager --release --formats dmg --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: upx --lzma --best --filter=0 target/${{ matrix.target }}/release/bouwer.exe

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.package }}
          if-no-files-found: error
